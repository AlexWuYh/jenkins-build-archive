<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Jenkins Build Archive{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="topbar">
  <div class="container topbar-inner">
    <a class="brand" href="/">Jenkins <span>Build Archive</span></a>
    <nav class="top-nav" aria-label="主导航">
      <a href="/" class="nav-link {% if request.url.path == '/' or request.url.path.startswith('/build') %}is-active{% endif %}">构建列表</a>
      <a href="/admin" class="nav-link {% if request.url.path.startswith('/admin') %}is-active{% endif %}">管理</a>
      <div class="status" title="服务在线"><i aria-hidden="true"></i> Archive Online</div>
    </nav>
  </div>
</header>

<main class="container">
  {% block content %}{% endblock %}
</main>

<footer class="site-footer">
  <div class="container footer-inner">
    <div class="footer-brand">
      <strong>Jenkins Build Archive</strong>
      <span>独立构建元数据归档</span>
    </div>
    <div class="footer-meta">
      <span>Author <a class="footer-link" href="https://github.com/AlexWuYh" target="_blank" rel="noopener">AlexWuYh</a></span>
      <span class="footer-sep" aria-hidden="true">·</span>
      <a class="footer-link" href="https://github.com/AlexWuYh/jenkins-build-archive" target="_blank" rel="noopener">GitHub</a>
      <span class="footer-sep" aria-hidden="true">·</span>
      <a class="footer-link" href="https://github.com/AlexWuYh/jenkins-build-archive/blob/main/LICENSE" target="_blank" rel="noopener">MIT License</a>
    </div>
  </div>
</footer>
</body>
</html>
